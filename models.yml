# One entry per model of claude/italy_models_status.md. TODO = fill in after the model check.
# Names have no spaces (used in file names and by scripts/smoke_test.sh).

# mag_compl = Mt of the input catalog (input_config.catalog.mag_min in config.yml)
# build: docker runs the image CMD (func is only a label); repo_hash = branch/tag with the Dockerfile
- mock:
    giturl: https://github.com/pabloitu/pymock.git
    repo_hash: main
    path: models/mock
    build: docker
    func: pymock
    prefix: pymock
    forecast_unit: 1
    func_kwargs:
      n_sims: 1000
      seed: 23
      mag_min: 4.0
      mag_compl: 2.5

# same code, negative binomial counts (as in floatcsep tutorial H)
- mock_nb:
    giturl: https://github.com/pabloitu/pymock.git
    repo_hash: main
    path: models/mock_nb
    build: docker
    func: pymock
    prefix: pymock
    forecast_unit: 1
    func_kwargs:
      n_sims: 1000
      seed: 23
      mag_min: 4.0
      mag_compl: 2.5
      distribution: negbinom
      apply_mc_to_lambda: True

# Python ETAS family (GFZ repos, branch italy_v1): Docker image, ENTRYPOINT <prefix>-run reads
# /app/input/args.json + catalog.csv. Catalog i uses seed + i, so n_jobs never changes a forecast.
# n_jobs: 1 for run_mode parallel (one container per window, no CPU limit); drop it in sequential
# mode to use all cores. Inputs: M >= 3.0 (mc in each repo's input/args.json), depth < depth_max.
- vetas:
    giturl: git@git.gfz-potsdam.de:csep/it_experiment/models/vetas.git
    repo_hash: italy_v1
    path: models/vetas
    build: docker
    args_file: args.json
    func: etas-run
    prefix: etas
    forecast_unit: 1
    func_kwargs:
      n_sims: 1000
      seed: 23
      mag_min: 4.0
      depth_max: 30
      n_jobs: 1

# two inversions (free background, free productivity) + question-driven ensemble QDE(1,1,0)
