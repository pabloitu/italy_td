# One entry per model of claude/italy_models_status.md. TODO = fill in after the model check.
# Names have no spaces (used in file names and by scripts/smoke_test.sh).

# mag_compl = Mt of the input catalog (input_config.catalog.mag_min in config.yml)
# build: docker runs the image CMD (func is only a label); repo_hash = branch/tag with the Dockerfile
- mock:
    giturl: https://github.com/pabloitu/pymock.git
    repo_hash: main
    path: models/mock
    build: docker
    func: pymock
    prefix: pymock
    forecast_unit: 1
    func_kwargs:
      n_sims: 1000
      seed: 23
      mag_min: 4.0
      mag_compl: 2.5

# same code, negative binomial counts (as in floatcsep tutorial H)
- mock_nb:
    giturl: https://github.com/pabloitu/pymock.git
    repo_hash: main
    path: models/mock_nb
    build: docker
    func: pymock
    prefix: pymock
    forecast_unit: 1
    func_kwargs:
      n_sims: 1000
      seed: 23
      mag_min: 4.0
      mag_compl: 2.5
      distribution: negbinom
      apply_mc_to_lambda: True

# ETAS family (GFZ GitLab, ssh; every machine needs a key: `ssh -T git@git.gfz-potsdam.de`).
# Docker ENTRYPOINT <prefix>-run reads /app/input/args.json + catalog.csv, writes
# /app/forecasts/<prefix>_{start}_{end}.csv (depth 0, CSEP testing cells only, catalog i seeded with
# seed + i). n_jobs = processes per container; prepare_runs.py sets n_sims, n_jobs and the fit
# window keys (timewindow_start, auxiliary_start) per run.
- vetas:
    giturl: git@git.gfz-potsdam.de:csep/it_experiment/models/vetas.git
    repo_hash: italy_v1
    path: models/vetas
    build: docker
    args_file: args.json
    func: etas-run
    prefix: etas
    forecast_unit: 1
    func_kwargs: {n_sims: 1000, seed: 23, mag_min: 4.0, depth_max: 30, n_jobs: 1}

- fletas:
    giturl: git@git.gfz-potsdam.de:csep/it_experiment/models/fletas.git
    repo_hash: italy_v1
    path: models/fletas
    build: docker
    args_file: args.json
    func: fletas-run
    prefix: fletas
    forecast_unit: 1
    func_kwargs: {n_sims: 1000, seed: 23, mag_min: 4.0, depth_max: 30, n_jobs: 1}

- petai:
    giturl: git@git.gfz-potsdam.de:csep/it_experiment/models/petai.git
    repo_hash: italy_v1
    path: models/petai
    build: docker
