# One entry per model of claude/italy_models_status.md. TODO = fill in after the model check.
# Names have no spaces (used in file names and by scripts/smoke_test.sh).

# mag_compl = Mt of the input catalog (input_config.catalog.mag_min in config.yml)
# build: docker runs the image CMD (func is only a label); repo_hash = branch/tag with the Dockerfile
- mock:
    giturl: https://github.com/pabloitu/pymock.git
    repo_hash: main
    path: models/mock
    build: docker
    func: pymock
    prefix: pymock
    forecast_unit: 1
    func_kwargs:
      n_sims: 1000
      seed: 23
      mag_min: 4.0
      mag_compl: 2.5

# same code, negative binomial counts (as in floatcsep tutorial H)
- mock_nb:
    giturl: https://github.com/pabloitu/pymock.git
    repo_hash: main
    path: models/mock_nb
    build: docker
    func: pymock
    prefix: pymock
    forecast_unit: 1
    func_kwargs:
      n_sims: 1000
      seed: 23
      mag_min: 4.0
      mag_compl: 2.5
      distribution: negbinom
      apply_mc_to_lambda: True

# upstream code; swap giturl/repo_hash for the fork with the parallel catalog generation
- etas:
    giturl: https://github.com/swiss-seismological-service/etas.git
    repo_hash: csep/v1.0.0
    path: models/etas
    build: conda
    args_file: args.json
    func: etas-run
    prefix: etas
    forecast_unit: 1
    func_kwargs:
      n_sims: 1000
      seed: 23
      mc: 4.0

