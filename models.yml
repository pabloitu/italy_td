    forecast_unit: 1
    func_kwargs: {n_sims: 1000, seed: 23, mag_min: 4.0, depth_max: 30, n_jobs: 1}

# R (inlabru 2.4.0 + INLA 22.04.16); fits on M >= mag_compl, so input_config.catalog.mag_min <= 2.5
# n_cores: cores per container (default all). With run_mode: parallel add n_cores: 1 (floatCSEP runs
# one container per window, up to min(host cores, 32), without CPU limits)
- inlabru_td:
    giturl: git@git.gfz-potsdam.de:csep/it_experiment/models/inlabru-dependent.git
    repo_hash: italy_v1
    path: models/inlabru_td
    build: docker
    args_file: args.txt
    func: Rscript source/source_inlabru_1dayfore.R
    prefix: inlabru_td
    forecast_unit: 1
    func_kwargs:
      n_sims: 1000
      seed: 23
      mag_min: 4.0
      mag_compl: 2.5
      fit_years: 1
      max_events: 100000
      n_cores: 1

